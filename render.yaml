# Render Blueprint: one free Docker web service running the whole app as one Node process.
# Secrets are `sync: false`, so Render asks for them when the Blueprint is applied; none live in the repo.
# The free plan has no persistent disk and sleeps after 15 minutes without traffic, so show logs under
# /data last only as long as the instance; a demo show is seeded fresh on each start.
services:
  - type: web
    name: claim
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
