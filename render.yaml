# Render Blueprint: one free Docker web service running the whole app as one Node process.
# Secrets are `sync: false`, so Render asks for them when the Blueprint is applied; none live in the repo.
# The free plan has no persistent disk and sleeps after 15 minutes without traffic, so show logs under
# /data last only as long as the instance; a demo show is seeded fresh on each start.
services:
  - type: web
    name: claim
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
  # The Nebius x NVIDIA entry: Nemotron on Token Factory, payments simulated (no PayPal keys), so every
  # beat runs end to end without a sandbox login. The token budget and switch-off date cap what a public
  # demo can spend on a pay-per-token key; past either, the resolver runs on its rules alone.
  - type: web
    name: claim-nemotron
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: nebius
      - key: NEBIUS_API_KEY
        sync: false
      - key: LLM_TOKEN_BUDGET
        value: "60000"
      - key: LLM_DISABLE_AFTER
        value: "2026-12-16T00:00:00Z"
